<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Settings</title>
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
  </head>
  <body>
    <sdpi-item label="Zone">
      <sdpi-select
        setting="zone"
        datasource="getZones"
        loading="Fetching zones..."
        placeholder="Please select"
        hot-reload
      ></sdpi-select>
    </sdpi-item>
    <sdpi-item label="Action">
      <sdpi-select
        setting="action"
        datasource="getVolumeActions"
        loading="Fetching actions..."
        placeholder="Please select"
        hot-reload
      ></sdpi-select>
  </body>
</html>
