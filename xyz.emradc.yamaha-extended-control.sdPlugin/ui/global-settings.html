<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
    <title>Settings</title>
  </head>
  <body>
    <div class="sdpi-wrapper">
      <sdpi-item label="IP Address">
        <sdpi-textfield
          setting="ipAddress"
          placeholder="192.168.0.xx"
          pattern="/^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$/"
          required
          global
        ></sdpi-textfield>
      </sdpi-item>
      <sdpi-item label="Port">
        <sdpi-textfield
          setting="port"
          placeholder="80"
          pattern="/^(6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3})$/"
          required
          global
        ></sdpi-textfield>
      </sdpi-item>
      <sdpi-item>
        <sdpi-button onclick="onSave(event)">Save</sdpi-button>
      </sdpi-item>
    </div>

    <script src="global-settings.js"></script>
  </body>
</html>
